<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="mahekGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e5bb42" />
      <stop offset="50%" stop-color="#c59b27" />
      <stop offset="100%" stop-color="#9a7413" />
